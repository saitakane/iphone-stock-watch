name: iPhone在庫チェック

on:
  schedule:
    # 「起動役」兼「安全網」。連鎖が切れてもここが拾う
    # JST 7:00〜21:59（UTC 22:00〜12:59）
    - cron: '*/5 22-23,0-12 * * *'
  workflow_dispatch:
    inputs:
      chained:
        description: '自動連鎖用（手動実行するときは触らないでください）'
        type: boolean
        default: false
      simulate:
        description: '通知テスト用：入荷した体で通知を送るカラー（pink / ultramarine / teal / white。通常は空欄）'
        type: string
        default: ''
      probe_url:
        description: '判定テスト用：在庫ありの商品ページURLを貼ると、1回だけ判定して終了（通常は空欄）'
        type: string
        default: ''

permissions:
  contents: write   # state/ のコミット用
  actions: write    # 自己連鎖（workflow_dispatch）用

concurrency:
  # simulate指定のテスト実行は別グループ（本番ジョブの終了待ちをせず即実行。状態も保存しない）
  group: ${{ (inputs.simulate || inputs.probe_url) && 'stock-check-test' || 'stock-check' }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - name: 在庫チェック
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # 手動実行（テスト）は2ループだけで終了。通常・連鎖は55ループ
          LOOPS: ${{ (github.event_name == 'workflow_dispatch' && !inputs.chained) && '2' || '55' }}
          INTERVAL: '60'
          TEST_NOTIFY: ${{ (github.event_name == 'workflow_dispatch' && !inputs.chained) && '1' || '0' }}
          SIMULATE_IN: ${{ (github.event_name == 'workflow_dispatch' && !inputs.chained) && inputs.simulate || '' }}
          PROBE_URL: ${{ (github.event_name == 'workflow_dispatch' && !inputs.chained) && inputs.probe_url || '' }}
        run: bash check.sh

      - name: 状態を保存
        if: always()
        run: |
          if [ -d state ] && [ -n "$(git status --porcelain state)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state
            MSG="state:"
            for f in state/*.txt; do MSG="$MSG $(basename "$f" .txt)=$(cat "$f")"; done
            git commit -m "$MSG"
            git pull --rebase --autostash
            git push
          else
            echo "状態に変化なし。コミットしません。"
          fi

      - name: 次の実行を予約（自己連鎖）
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}      # ← PAT不要。毎回自動発行
          GH_REPO: ${{ github.repository }}
        run: |
          H=$(TZ='Asia/Tokyo' date +%H)
          H=$((10#$H))
          if [ "$H" -ge 7 ] && [ "$H" -le 21 ]; then
            echo "現在 ${H}時(JST) → 次の実行を予約します"
            gh workflow run check.yml --ref main -f chained=true
            echo "予約しました"
          else
            echo "現在 ${H}時(JST) → 夜間のため連鎖を止めます（翌朝7時にcronが再開）"
          fi
